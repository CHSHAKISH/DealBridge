services:
  postgres:
    image: postgres:16-alpine
    container_name: dealbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealbridge
      POSTGRES_PASSWORD: dealbridge_password
      POSTGRES_DB: dealbridge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealbridge -d dealbridge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dealbridge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:

